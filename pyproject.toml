[project]
name = "kbo-to-mlb-projection"
version = "0.3.0"
description = "Project Major League Baseball performance based on KBO statistics."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12",
]

[project.scripts]
project = "kbo_to_mlb:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
